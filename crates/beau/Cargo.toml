[package]
name = "beau"
version = "0.1.0"
description = "Design tokens, typography, motion and components that make egui apps look polished."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/beau"
readme = "../../README.md"
keywords = ["egui", "gui", "ui", "design-system", "components"]
categories = ["gui", "wasm"]
include = ["src/**", "assets/**", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
# The only dependency: beau is a layer on top of egui.
egui = { workspace = true }

[dev-dependencies]
# Test-only: renders components headlessly and compares them against
# committed PNG snapshots (#19). Not part of the published library's
# dependency tree.
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }

[lints]
workspace = true
