name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      beau: ${{ steps.release.outputs['crates/beau--release_created'] }}
    steps:
      # Uses RELEASE_PLEASE_TOKEN when set, so CI runs on release PRs
      # (events created with the default GITHUB_TOKEN don't trigger workflows).
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging a release PR tags the release; this then publishes the crate.
  # It authenticates with crates.io trusted publishing (OIDC), so there is no
  # long-lived token: the trusted publisher on crates.io names this repository
  # and this workflow file.
  publish:
    name: Publish to crates.io
    needs: release-please
    if: needs.release-please.outputs.beau == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "beau") | .version')
          status=$(curl -sS -o index.json -w '%{http_code}' https://index.crates.io/be/au/beau)
          if [ "$status" = 404 ]; then
            # Trusted publishing only works for a crate that exists.
            echo "::warning::beau is not on crates.io yet. Publish $version by hand (cargo publish -p beau), then add this workflow as a trusted publisher on crates.io."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 200 ]; then
            echo "::error::crates.io index returned $status"
            exit 1
          elif jq -e --arg v "$version" 'select(.vers == $v)' index.json > /dev/null; then
            echo "beau $version is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.skip != 'true'
        id: auth
      - if: steps.check.outputs.skip != 'true'
        run: cargo publish -p beau --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
